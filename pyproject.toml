[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "volmax-power-signal-tools"
version = "0.2.0rc1"
description = "Reproducible software analysis of sampled electrical signals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ivan Nestorov"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["signal-processing", "power-quality", "thd", "fft", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
wavelets = ["PyWavelets>=1.4"]
test = ["pytest>=7"]

[project.scripts]
volmax-signal-report = "power_signal_tools.cli:main"

[project.urls]
Repository = "https://github.com/VolMax-Studio/Power_Signal_Tools_Portfolio"

[tool.setuptools.packages.find]
include = ["power_signal_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
